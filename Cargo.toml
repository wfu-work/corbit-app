[workspace]
members = [
    "crates/corbit-app",
    "crates/corbit-client",
    "crates/corbit-macos-interop",
    "crates/corbit-protocol",
]
exclude = ["vendor/gpui-component"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.102"
async-channel = "2.5.0"
base64 = "0.22.1"
chrono = "0.4.45"
corbit-client = { path = "crates/corbit-client" }
corbit-macos-interop = { path = "crates/corbit-macos-interop" }
corbit-protocol = { path = "crates/corbit-protocol" }
futures-util = "0.3.31"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
uuid = { version = "1.21.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

# Keep application code debuggable while avoiding pathologically slow text
# layout and Markdown rendering in local development builds.
[profile.dev.package.cosmic-text]
opt-level = 3

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.markdown]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3
